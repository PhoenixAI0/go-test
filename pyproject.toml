[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go_rl"
version = "0.1.0"
description = "Go RL training utilities with KataGo-based rewards"
authors = [{ name = "Go RL Team" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "datasets>=3.0.0",
    "trl==0.24.0",
    "peft==0.18.1",
    "bitsandbytes==0.49.2 ; sys_platform == 'linux'",
    "accelerate>=0.34.0",
    "sgfmill>=1.1.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
upload = [
    "huggingface_hub>=0.24.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["go_rl*", "go_parser*"]
