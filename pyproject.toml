[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go_rl"
version = "0.1.0"
description = "Go RL training utilities with KataGo-based rewards"
authors = [{ name = "Go RL Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "trl>=0.11.0",
    "accelerate>=0.34.0",
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "sgfmill>=1.1.1",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
upload = [
    "huggingface_hub>=0.24.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools.packages.find]
include = ["go_rl*", "go_parser*"]
