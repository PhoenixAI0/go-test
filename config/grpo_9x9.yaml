dataset: data/rl_prompts_9x9.jsonl
training:
  model_name: qwen-3-8b
  output_dir: outputs/grpo_9x9
  log_dir: logs/grpo_9x9
  max_seq_length: 2048
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 1e-5
  num_steps: 2000
  seed: 3407
  lora_rank: 64
  use_lora: true
katago:
  binary_path: ${KATAGO_BIN}
  model_path: ${KATAGO_MODEL}
  config_path: ${KATAGO_CONFIG}
  board_size: 9
  rules: chinese
  komi: 7.5
reward:
  winrate_scale: 1.0
  legal_bonus: 0.2
  illegal_penalty: -1.0
  length_penalty: -0.05
  full_game_bonus: 0.5
  strict_legality: false
rollout:
  num_samples: 8
  temperature: 1.0
  top_p: 0.9
  max_tokens: 4
  stop_at_pass: true
promotion_gate:
  metric: elo_delta_or_winrate
  threshold_elo: 150
  threshold_winrate: 0.55
  evaluation_games: 200
  notes: Promote to 19x19 when either threshold is met on 9x9.
