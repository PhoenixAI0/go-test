# Self-Play Configuration for 9x9 Go
# Generate training data by having the model play against itself

# Path to trained model checkpoint
# Should be a directory containing adapter_config.json and adapter_model.safetensors
model_path: outputs/grpo_9x9/final

# Board configuration
board_size: 9

# Number of games to generate
# More games = more diverse training data
# Recommended: 100-1000 for curriculum learning
num_games: 100

# Maximum moves per game
# Games exceeding this limit will be truncated
# 9x9 games typically have 40-80 moves
max_moves: 150

# Sampling configuration
# Higher temperature = more exploration (varied play)
# Lower temperature = more exploitation (stronger play)
temperature: 1.0

# Top-p (nucleus) sampling
# Only sample from top p probability mass
# Lower = more conservative, higher = more creative
top_p: 0.9

# Maximum tokens to generate per move
# Should be enough for "D4" or "PASS" plus some buffer
max_tokens: 10

# Output directory for SGF files
output_dir: data/self_play/9x9

# Parallel game generation (experimental)
# Currently only supports 1 (sequential generation)
parallel_games: 1

# Random seed for reproducibility
# Set to null for random seed
seed: 42
