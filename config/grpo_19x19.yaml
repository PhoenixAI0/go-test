dataset: data/rl_prompts_19x19.jsonl
training:
  model_name: outputs/grpo_9x9  # Load from 9x9 GRPO checkpoint (curriculum learning)
  output_dir: outputs/grpo_19x19
  log_dir: logs/grpo_19x19
  max_seq_length: 4096
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 1.0e-5
  num_steps: 4000
  seed: 3407
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.0
  use_lora: true
  use_8bit_optimizer: true
  quantization_bits: 4
  reasoning:
    enabled: true
    profile: auto
    optimize_final_only: true
    malformed_policy: mask_all
    qwen_enable_thinking: false
    gpt_oss_reasoning_effort: medium
    glm_thinking_type: enabled
    glm_clear_thinking: false
    future_reasoning_length_penalty: 0.0
katago:
  binary_path: ${KATAGO_BIN}
  model_path: ${KATAGO_MODEL}
  config_path: katago_analysis_train.cfg
  board_size: 19
  rules: chinese
  komi: 7.5
reward:
  winrate_scale: 1.0
  legal_bonus: 0.2
  illegal_penalty: -1.0
  full_game_bonus: 0.5
  strict_legality: true
rollout:
  num_samples: 8
  temperature: 1.0
  top_p: 0.9
  max_tokens: 16
notes:
  promotion_gate: Train 19x19 after the 9x9 promotion gate is met.
promotion_gate_fullgame:
  metric: winrate
  threshold_winrate: 0.55
  evaluation_games: 200
  notes: Promote to full-game GRPO when 19x19 winrate threshold is met.
