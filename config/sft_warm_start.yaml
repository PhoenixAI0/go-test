dataset_path: data/sft_9x9.jsonl
model_name: Qwen/Qwen3-8B
output_dir: outputs/sft_warm_start
log_dir: logs/sft_warm_start
max_seq_length: 1024
epochs: 1
batch_size: 1
learning_rate: 5.0e-5
lora_rank: 64
lora_alpha: 16
lora_dropout: 0.0
use_packing: false
use_8bit_optimizer: true
quantization_bits: 4
seed: 3407
eval_split_ratio: 0.05
eval_steps: 200
reasoning:
  enabled: true
  profile: auto
  optimize_final_only: true
  malformed_policy: mask_all
  qwen_enable_thinking: false
  gpt_oss_reasoning_effort: medium
  glm_thinking_type: enabled
  glm_clear_thinking: false
  future_reasoning_length_penalty: 0.0
