# SFT Configuration for 19x19 Go
# Compatibility TRL SFT entrypoint. The direct research recipe additionally pins
# the model revision and supports exact optimizer/RNG checkpoint continuation.

dataset_path: data/sft_19x19.jsonl
model_name: Qwen/Qwen3-0.6B
input_encoding: compact
output_dir: outputs/sft_warm_start_19x19
log_dir: logs/sft_warm_start_19x19

# Current board matrix, objective, and recent moves; full game history remains
# in dataset metadata for verification rather than a 400-move text transcript.
max_seq_length: 1024

epochs: 1

# Conservative starting batch; tune against actual memory on the target device.
batch_size: 2

learning_rate: 1e-4

# Small-model baseline, not a demonstrated optimum.
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0

# Training optimizations
use_packing: false
use_8bit_optimizer: false
quantization_bits: 16

# Random seed for reproducibility
seed: 3407

# Validation split and eval cadence for W&B loss/perplexity tracking
eval_split_ratio: 0.05
eval_steps: 200
reasoning:
  enabled: true
  profile: auto
  optimize_final_only: true
  malformed_policy: mask_all
  qwen_enable_thinking: false
  gpt_oss_reasoning_effort: medium
  glm_thinking_type: enabled
  glm_clear_thinking: false
  future_reasoning_length_penalty: 0.0
