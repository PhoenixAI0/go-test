# Bounded pilot using the selected development training/decoder settings.
# Requires the existing local frozen v4/validation-v3 data; generated data is not in Git.
# This selection does not establish strategic strength or an optimal long-run budget.
# Inspect: uv run --locked python scripts/train_19x19.py --config config/policy_19x19_qwen06_pilot.yaml --dry-run
# Train: repeat without --dry-run, using a fresh --output-dir for each run.
# Add --evaluate to compare moves and play paired games with text beam width 4.
# Set KATAGO_MODEL to the intended evaluator; no engine is needed for label-reuse training alone.
board_size: 19
train_kind: text
model: Qwen/Qwen3-0.6B
revision: c1899de289a04d12100db370d81485cdf75e47ca
dataset: data/sft_19x19.jsonl
train_data: data/teacher_v4_visits64.jsonl
eval_data: data/teacher_19x19_val_v3.jsonl
resume_from: null
init_checkpoint: null
output_dir: outputs/qwen06_19x19_pilot
device: auto
seed: 3407
rules: koPOSITIONALscoreAREAtaxNONEsui0
komi: 7.5
katago:
  binary: ${KATAGO_BIN}
  model: ${KATAGO_MODEL}
  analysis_config: config/katago_analysis_train.cfg
  eval_config: config/katago_analysis_eval.cfg
  gtp_config: config/katago_gtp_eval.cfg
teacher:
  # Recorded budget; both provided label paths bypass teacher generation.
  train_positions: 512
  eval_positions: 63
  positions_per_game: 32
  min_move: 0
  max_move: null
  sampling: game-phase
  max_visits: 64
  prior_mix: 0.5
  batch_size: 8
training:
  steps: 120
  batch_size: 4
  gradient_accumulation: 1
  eval_every: 60
  checkpoint_every: 60
  learning_rate: 0.0001
  lora_rank: 16
  lora_alpha: 32
  max_seq_length: 1024
text_training:
  encoding: compact
  symmetries: 8
  generation_positions: 8
  max_new_tokens: 16
categorical_training:
  # Unused by the selected text pilot; retained for the common recipe schema.
  encoding: cells
  readout: cells
  attention: bidirectional
  head_init_std: 0.001
  symmetries: 1
  target: policy
  head_learning_rate: 0.001
  value_weight: 0.25
selfplay:
  enabled: false
  updates: 100
  episodes_per_update: 4
  max_plies: 1083
  minibatch_size: 8
  ppo_epochs: 2
  learning_rate: 0.00001
evaluation:
  # Optional evaluation budgets are independent of the fixed training budget.
  enabled: false
  text_num_beams: 4
  max_positions: 128
  max_visits: 64
  num_games: 20
  max_moves: 1083
  main_time: 300
  byoyomi_time: 10
  byoyomi_periods: 5
