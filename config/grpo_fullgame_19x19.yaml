dataset: data/rl_prompts_19x19.jsonl
training:
  model_name: outputs/grpo_19x19
  output_dir: outputs/grpo_fullgame_19x19
  log_dir: logs/grpo_fullgame_19x19
  max_seq_length: 4096
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 8.0e-6
  num_steps: 3000
  seed: 3407
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.0
  use_lora: true
  use_8bit_optimizer: true
  quantization_bits: 4
  reasoning:
    enabled: true
    profile: auto
    optimize_final_only: false
    malformed_policy: mask_all
    qwen_enable_thinking: false
    gpt_oss_reasoning_effort: medium
    glm_thinking_type: enabled
    glm_clear_thinking: false
    future_reasoning_length_penalty: 0.0
katago:
  binary_path: ${KATAGO_BIN}
  model_path: ${KATAGO_MODEL}
  config_path: katago_analysis_train.cfg
  board_size: 19
  rules: chinese
  komi: 7.5
reward:
  winrate_scale: 0.0
  legal_bonus: 0.0
  illegal_penalty: -1.0
  full_game_bonus: 0.0
  scorelead_scale: 0.02
  terminal_outcome_bonus: 1.0
  illegal_move_ends_game: true
  strict_legality: true
rollout:
  num_samples: 8
  temperature: 0.8
  top_p: 1.0
  top_k: 0
  max_tokens: 16
full_game:
  enabled: true
  max_plies: 300
  termination_two_passes: true
  opponent_policy: katago_best
  model_color_mode: alternate
  seed_empty_board_prob: 0.4
  max_model_turns: 150

# Explicit objective baseline; compare alternatives at matched compute.
grpo:
  loss_type: dr_grpo
  scale_rewards: none
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  num_iterations: 1
  importance_sampling_level: token
  mask_truncated_completions: false
  top_entropy_quantile: 1.0
