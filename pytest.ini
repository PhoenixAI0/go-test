[pytest]
testpaths = tests
markers =
    katago: tests that require KataGo integration
filterwarnings =
    ignore:'return' in a 'finally' block:SyntaxWarning:multiprocess\.connection
    ignore:Importing from torchao\.dtypes\.uintx\.dyn_int8_act_int4_wei_cpu_layout is deprecated\..*:DeprecationWarning:torchao\.dtypes\.uintx
    ignore:Importing from torchao\.dtypes\.uintx\.uintx_layout is deprecated\..*:DeprecationWarning:torchao\.dtypes\.uintx
    ignore:Importing BlockSparseLayout from torchao\.dtypes is deprecated\..*:DeprecationWarning:torchao\.dtypes
    ignore:"\\\." is an invalid escape sequence\..*:SyntaxWarning:torchao\.quantization\.quant_api
